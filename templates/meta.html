<meta charset="UTF-8">
<meta property="og:type"               content="profile" />
<meta property="og:title"              content="{{ name if external else shortname }} | myself.social" />
<meta property="og:description" content="{{ actor.summary|replace('</p>', ' ')|striptags|safe if actor.summary else 'Profile of ' ~ shortname ~ ' at myself.social.' }}" />
<meta property="og:image" content="{{ actor.icon.url if actor.image else url_for('static', filename='img/myself_banner.png') }}" />
