<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up</title>
</head>
<body>
    <h2>Sign up</h2>
    {% if error %}
        <p role="alert">{{ error }}</p>
    {% endif %}
    <form method="POST" action="/signup">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username"><br>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password"><br>
        <input type="submit" value="Sign up">
    </form>

    <h2>Or sign up with Mastodon</h2>
    <p>We'll send you to your home server to approve access. No password is stored here,
       and the link to your Mastodon profile is verified automatically — you just proved it's yours.</p>
    <form method="POST" action="/auth/mastodon">
        <label for="instance">Your Mastodon handle or server</label>
        <input type="text" id="instance" name="instance" placeholder="you@mastodon.social"><br>
        <input type="submit" value="Continue with Mastodon">
    </form>
</body>
</html>
